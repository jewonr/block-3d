<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록 3D</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding-full.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/javascript_compressed.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/msg/ko.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24"><path d="M12 2.5 3.5 7.2v9.6l8.5 4.7 8.5-4.7V7.2z"/><path d="m3.5 7.2 8.5 4.7 8.5-4.7"/><path d="M12 11.9v9.6"/></svg>
    블록 3D
  </div>
  <div class="grow"></div>
  <div class="tools">
    <button class="icon" id="undo" title="되돌리기">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon" id="redo" title="다시 하기">
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon" id="new" title="새로 만들기">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg>
    </button>
    <button class="icon" id="open" title="열기">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="icon" id="save" title="저장">
      <svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><path d="M7 21v-7h10v7"/></svg>
    </button>
    <select class="ex" id="examples"><option value="" hidden selected>예제</option></select>
    <button class="btn ghost" id="export">
      <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
      내보내기
    </button>
    <button class="btn run" id="run">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span>실행</span>
    </button>
  </div>
</header>

<main class="app" id="app">
  <section class="workspace"><div id="blockly"></div></section>

  <div class="split v" id="splitV"></div>

  <section class="side" id="side">
    <div class="stage" id="stage">
      <canvas id="canvas" tabindex="0"></canvas>
      <div class="stage-tools">
        <button class="icon sm" id="home" title="카메라 처음으로">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="icon sm" id="full" title="전체 화면">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="split h" id="splitH"></div>

    <div class="pane code">
      <div class="pane-head">
        <span class="file">main.js</span>
        <div class="grow"></div>
        <button class="icon sm" id="copy" title="복사">
          <svg class="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <svg class="i-done" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
        </button>
      </div>
      <pre class="code-view" id="code"></pre>
    </div>
  </section>
</main>

<input type="file" id="file" accept=".json,application/json" hidden>

<script src="blocks.js"></script>
<script src="app.js"></script>
</body>
</html>
